name: Orven CI / CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-build:
    name: Build, Lint & Automated E2E Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 22.x, 24.x ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Build All Monorepo Workspaces
        run: npm run build:all

      - name: Run Mainnet Pre-Flight & Security Checks
        run: npm run verify:mainnet

      - name: Run Comprehensive E2E System Test Suite (66 Tests)
        run: npm run test:e2e

      - name: Run Live Playwright Browser Simulation (UI & User Flows)
        run: npm run qa:test

      - name: Upload QA Report & Screenshots Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-qa-artifacts-node-${{ matrix.node-version }}
          path: |
            qa-artifacts/
            docs/QA_AUDIT_REPORT.md
          retention-days: 14
